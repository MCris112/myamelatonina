<app-breadcumb title="Nuestros Productos" />

<section>
  <div class="container-fluid-2 shop tab py-100px">
    <!-- shop header -->
    <div
      class="courses-header flex justify-between items-center flex-wrap px-30px py-9px bg-darkdeep3 dark:bg-darkdeep3-dark mb-50px gap-y-5"
      data-aos="fade-up"
    >
      <div
        class="tab-links transition-all duraton-300 text-blackColor dark:text-blackColor-dark flex gap-11px"
      >
        <button class="inline-block hover:text-primaryColor" (click)="columnsToShow = 2">
          <svg
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 5.5 12.5"
            class="w-5 h-5"
          >
            <defs></defs>
            <defs></defs>
            <g data-name="Layer 2">
              <g data-name="Layer 1">
                <g data-name="shop page">
                  <g id="Group-10">
                    <path
                      d="M.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 01.75 0z"
                      class="cls-1"
                    ></path>
                    <path
                      d="M4.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 014.75 0z"
                      class="cls-1"
                      data-name="Rectangle"
                    ></path>
                  </g>
                </g>
              </g>
            </g>
          </svg>
        </button>
        <button class="inline-block hover:text-primaryColor active" (click)="columnsToShow = 3">
          <svg
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 9.5 12.5"
            class="w-5 h-5"
          >
            <defs></defs>
            <defs>
              <style>
                .cls-1 {
                  fill-rule: evenodd;
                }
              </style>
            </defs>
            <g data-name="Layer 2">
              <g data-name="Layer 1">
                <g data-name="shop page">
                  <g id="Group-16">
                    <path
                      d="M.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 01.75 0z"
                      class="cls-1"
                    ></path>
                    <path
                      d="M4.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 014.75 0z"
                      class="cls-1"
                      data-name="Rectangle"
                    ></path>
                    <path
                      d="M8.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 018.75 0z"
                      class="cls-1"
                      data-name="Rectangle"
                    ></path>
                  </g>
                </g>
              </g>
            </g>
          </svg>
        </button>
        <button class="inline-block hover:text-primaryColor" (click)="columnsToShow = 4">
          <svg
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 13.5 12.5"
            class="w-5 h-5"
          >
            <defs></defs>
            <defs>
              <style>
                .cls-1 {
                  fill-rule: evenodd;
                }
              </style>
            </defs>
            <g data-name="Layer 2">
              <g data-name="Layer 1">
                <g data-name="shop page">
                  <g id="_4_col" data-name="4_col">
                    <path
                      d="M.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 01.75 0z"
                      class="cls-1"
                    ></path>
                    <path
                      d="M4.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 014.75 0z"
                      class="cls-1"
                      data-name="Rectangle"
                    ></path>
                    <path
                      d="M8.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11A.76.76 0 018.75 0z"
                      class="cls-1"
                      data-name="Rectangle"
                    ></path>
                    <path
                      id="Rectangle-4"
                      d="M12.75 0a.76.76 0 01.75.75v11a.76.76 0 01-.75.75.76.76 0 01-.75-.75v-11a.76.76 0 01.75-.75z"
                      class="cls-1"
                      data-name="Rectangle"
                    ></path>
                  </g>
                </g>
              </g>
            </g>
          </svg>
        </button>
      </div>

      <div class="flex items-center flex-wrap">
        <div class="mr-50px">
          <label class="text-blackColor dark:text-blackColor-dark mr-6px"
            >Sort by :</label
          >
          <select
            class="text-blackColor dark:text-blackColor-dark p-10px w-185px rounded-md bg-transparent box-border"
          >
            <option class="dark:text-blackColor" value="Featured" selected>
              Featured
            </option>
            <option class="dark:text-blackColor" value="best-selling">
              Best Selling
            </option>
            <option class="dark:text-blackColor" value="title-ascending">
              Alphabetically, A-Z
            </option>
            <option class="dark:text-blackColor" value="title-descending">
              Alphabetically, Z-A
            </option>
            <option class="dark:text-blackColor" value="price-ascending">
              Price, low to high
            </option>
            <option class="dark:text-blackColor" value="price-descending">
              Price, high to low
            </option>
            <option class="dark:text-blackColor" value="created-descending">
              Date, new to old
            </option>
            <option class="dark:text-blackColor" value="created-ascending">
              Date, old to new
            </option>
          </select>
        </div>
        <div>
          <p class="text-blackColor dark:text-blackColor-dark">
            Showing 1 - 12 of 33 result
          </p>
        </div>
      </div>
    </div>
    <!-- books -->
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-x-30px">
      <!-- shop left -->
      <div class="xl:col-start-1 xl:col-span-3">
        <div
          class="mb-35px flex justify-between items-center"
          data-aos="fade-up"
        >
          <h4
            class="text-size-22 leading-1.2 font-bold text-blackColor dark:text-blackColor-dark"
          >
            Filter:
          </h4>
          <a
            href="#"
            class="text-contentColor dark:text-contentColor-dark leading-1.2 border-b border-blackColor dark:border-blackColor-dark"
            >Remove all</a
          >
        </div>
        <div class="mb-30px" data-aos="fade-up">
          <a
            href="create-course.html"
            class="text-size-15 text-whiteColor bg-primaryColor px-25px py-10px border border-primaryColor hover:text-primaryColor hover:bg-whiteColor rounded group text-nowrap"
          >
            $0.00-$80.00
          </a>
        </div>
        <!-- accordion filters -->
        <div
          class="gap-y-50px flex flex-col mb-50px text-blackColor dark:text-blackColor-dark leading-1.8"
        >
          <!-- Availability -->
          <ul class="accordion-container" data-aos="fade-up">
            <li
              class="accordion active shadow-accordion2 dark:shadow-accordion-dark p-5"
            >
              <div class="accordion-controller cursor-pointer block w-full">
                <div class="flex items-center">
                  <p
                    class="w-0 h-0 border-x-9 border-y-5px border-transparent border-l-blackColor dark:border-l-blackColor-dark inline-block translate-x-1"
                  ></p>

                  <p class="ml-0.5">Availability</p>
                </div>
              </div>
              <div class="accordion-content overflow-hidden">
                <div class="content-wrapper pt-10px">
                  <ul class="flex flex-col gap-y-10px">
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="instok" />
                      <label for="instok"> In stock</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="outofstok" />
                      <label for="outofstok"> Out of stock</label>
                    </li>
                  </ul>
                </div>
              </div>
            </li>
          </ul>
          <!-- Product type -->
          <ul class="accordion-container" data-aos="fade-up">
            <li
              class="accordion active shadow-accordion2 dark:shadow-accordion-dark p-5"
            >
              <div class="accordion-controller cursor-pointer block w-full">
                <div class="flex items-center">
                  <p
                    class="w-0 h-0 border-x-9 border-y-5px border-transparent border-l-blackColor dark:border-l-blackColor-dark inline-block translate-x-1"
                  ></p>

                  <p class="ml-0.5">Product type</p>
                </div>
              </div>
              <div class="accordion-content overflow-hidden">
                <div class="content-wrapper pt-10px">
                  <ul class="flex flex-col gap-y-10px">
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="apparel" />
                      <label for="apparel"> Apparel & Accessories</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="jacket" />
                      <label for="jacket"> Jacket</label>
                    </li>
                  </ul>
                </div>
              </div>
            </li>
          </ul>
          <!-- Brand -->
          <ul class="accordion-container" data-aos="fade-up">
            <li
              class="accordion active shadow-accordion2 dark:shadow-accordion-dark p-5"
            >
              <div class="accordion-controller cursor-pointer block w-full">
                <div class="flex items-center">
                  <p
                    class="w-0 h-0 border-x-9 border-y-5px border-transparent border-l-blackColor dark:border-l-blackColor-dark inline-block translate-x-1"
                  ></p>

                  <p class="ml-0.5">Brand</p>
                </div>
              </div>
              <div class="accordion-content overflow-hidden">
                <div class="content-wrapper pt-10px">
                  <ul class="flex flex-col gap-y-10px">
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="apple" />
                      <label for="apple"> Apple</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="amazon" />
                      <label for="amazon"> Amazon</label>
                    </li>
                  </ul>
                </div>
              </div>
            </li>
          </ul>
          <!-- Color-->
          <ul class="accordion-container" data-aos="fade-up">
            <li
              class="accordion active shadow-accordion2 dark:shadow-accordion-dark p-5"
            >
              <div class="accordion-controller cursor-pointer block w-full">
                <div class="flex items-center">
                  <p
                    class="w-0 h-0 border-x-9 border-y-5px border-transparent border-l-blackColor dark:border-l-blackColor-dark inline-block translate-x-1"
                  ></p>

                  <p class="ml-0.5">Color</p>
                </div>
              </div>
              <div class="accordion-content overflow-hidden">
                <div class="content-wrapper pt-10px">
                  <ul class="flex flex-col gap-y-10px">
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="Black" />
                      <label for="Black"> Black</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="Blue" />
                      <label for="Blue"> Blue</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="Grey" />
                      <label for="Grey"> Grey</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="Pink" />
                      <label for="Pink"> Pink</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="Red" />
                      <label for="Red"> Red</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="Violet" />
                      <label for="Violet"> Violet</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="White" />
                      <label for="White"> White</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="Yellow" />
                      <label for="Yellow"> Yellow</label>
                    </li>
                  </ul>
                </div>
              </div>
            </li>
          </ul>
          <!-- Color-->
          <ul class="accordion-container" data-aos="fade-up">
            <li
              class="accordion active shadow-accordion2 dark:shadow-accordion-dark p-5"
            >
              <div class="accordion-controller cursor-pointer block w-full">
                <div class="flex items-center">
                  <p
                    class="w-0 h-0 border-x-9 border-y-5px border-transparent border-l-blackColor dark:border-l-blackColor-dark inline-block translate-x-1"
                  ></p>

                  <p class="ml-0.5">Size</p>
                </div>
              </div>
              <div class="accordion-content overflow-hidden">
                <div class="content-wrapper pt-10px">
                  <ul class="flex flex-col gap-y-10px">
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="S" />
                      <label for="S"> S</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="M" />
                      <label for="M"> M</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="L" />
                      <label for="L"> L</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="XL" />
                      <label for="XL"> XL</label>
                    </li>
                    <li class="flex items-center gap-1">
                      <input type="checkbox" id="XXL" />
                      <label for="XXL"> XXL</label>
                    </li>
                  </ul>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
      <!-- shop right -->
      <div class="modal-container xl:col-start-4 xl:col-span-9">
        <div class="tab-contents">
          <!--2 cards -->
          <div class="transition-all duration-300">
            <div
              class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-{{columnsToShow}} -mx-15px"
            >
              <!-- card 1 -->
               @for (product of products; track product.id) {
                <product-item [data]="product"/>
               }
            </div>
          </div>
        </div>

        <!-- pagination -->
        <div data-aos="fade-up">
          <ul class="flex items-center justify-center gap-15px mt-60px mb-30px">
            <li>
              <a
                href="#"
                class="w-10 h-10 leading-10 md:w-50px md:h-50px md:leading-50px text-center text-blackColor2 hover:text-whiteColor bg-whitegrey1 hover:bg-primaryColor dark:text-blackColor2-dark dark:hover:text-whiteColor dark:bg-whitegrey1-dark dark:hover:bg-primaryColor cursor-not-allowed"
                ><i class="icofont-double-left"></i
              ></a>
            </li>
            <li>
              <a
                href="#"
                class="w-10 h-10 leading-10 md:w-50px md:h-50px md:leading-50px text-center text-whiteColor hover:text-whiteColor bg-primaryColor hover:bg-primaryColor dark:text-blackColor2-dark dark:hover:text-whiteColor dark:bg-primaryColor dark:hover:bg-primaryColor"
                >1</a
              >
            </li>
            <li>
              <a
                href="#"
                class="w-10 h-10 leading-10 md:w-50px md:h-50px md:leading-50px text-center text-blackColor2 hover:text-whiteColor bg-whitegrey1 hover:bg-primaryColor dark:text-blackColor2-dark dark:hover:text-whiteColor dark:bg-whitegrey1-dark dark:hover:bg-primaryColor"
                >2</a
              >
            </li>
            <li>
              <a
                href="#"
                class="w-10 h-10 leading-10 md:w-50px md:h-50px md:leading-50px text-center text-blackColor2 hover:text-whiteColor bg-whitegrey1 hover:bg-primaryColor dark:text-blackColor2-dark dark:hover:text-whiteColor dark:bg-whitegrey1-dark dark:hover:bg-primaryColor"
                >3</a
              >
            </li>
            <li>
              <a
                href="#"
                class="w-10 h-10 leading-10 md:w-50px md:h-50px md:leading-50px text-center text-blackColor2 hover:text-whiteColor bg-whitegrey1 hover:bg-primaryColor dark:text-blackColor2-dark dark:hover:text-whiteColor dark:bg-whitegrey1-dark dark:hover:bg-primaryColor"
                ><i class="icofont-double-right"></i
              ></a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
